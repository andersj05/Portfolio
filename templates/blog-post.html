<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#f3f1ea" />
    <meta property="og:title" content="{{TITLE}} - Anders Jensen" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://andersj.dev/blog/{{SLUG}}.html" />
    <meta property="og:image" content="https://andersj.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>{{TITLE}} - Anders Jensen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          Anders Jensen
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="../index.html#about">About</a>
          <a href="../index.html#projects">Projects</a>
          <a href="../blog.html" aria-current="page">Blog</a>
        </nav>
      </div>
    </header>

    <main id="content" class="article-shell">
      <article>
        <header class="post-header">
          <a class="post-back" href="../blog.html">&larr; All posts</a>
          <div>
            <time datetime="{{DATE}}">{{FORMATTED_DATE}}</time>
            <p class="eyebrow">Article</p>
          </div>
          <h1>{{TITLE}}</h1>
          <p class="post-summary">{{DESCRIPTION}}</p>
        </header>
        <div class="post-content">{{CONTENT}}</div>
      </article>
    </main>

    <footer class="site-footer">
      <div>
        <p>Anders Jensen</p>
        <a href="../blog.html">Blog index</a>
      </div>
      <p>&copy; <span data-current-year>2026</span></p>
    </footer>

    <script>
      document.querySelectorAll('[data-current-year]').forEach((element) => {
        element.textContent = new Date().getFullYear();
      });
    </script>
  </body>
</html>
