<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#fafaf8" />
    <meta property="og:title" content="{{TITLE}} - Anders Jensen" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://andersj.dev/blog/{{SLUG}}.html" />
    <meta property="og:image" content="https://andersj.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>{{TITLE}} - Anders Jensen</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../index.html">Anders Jensen</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="../index.html#about">About</a>
          <a href="../index.html#experience">Experience</a>
          <a href="../blog.html" aria-current="page">Blog</a>
        </nav>
      </div>
    </header>

    <main id="content">
      <article>
        <header class="post-header">
          <time datetime="{{DATE}}">{{FORMATTED_DATE}}</time>
          <h1>{{TITLE}}</h1>
          <p>{{DESCRIPTION}}</p>
        </header>
        <div class="post-content">{{CONTENT}}</div>
      </article>
      <a class="post-back" href="../blog.html">← All posts</a>
    </main>

    <footer class="site-footer">
      <div>
        <p>Anders Jensen</p>
        <a href="../index.html">Back to portfolio</a>
      </div>
      <p>© <span data-current-year>2026</span></p>
    </footer>

    <script>
      document.querySelectorAll('[data-current-year]').forEach((element) => {
        element.textContent = new Date().getFullYear();
      });
    </script>
  </body>
</html>
