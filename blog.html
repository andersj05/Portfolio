<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Writing from Anders Jensen on technology, markets, mathematics, and other interests."

    <meta name="theme-color" content="#f3f1ea" />
    <meta property="og:title" content="Blog - Anders Jensen" />
    <meta
      property="og:description"
      content="Writing from Anders Jensen on technology, markets, mathematics, and other interests."
    />
    <meta property="og:type" content="website" />

  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true"></span>

        </a>
        <nav class="site-nav" aria-label="Main navigation">

          <a href="index.html#projects">Projects</a>
          <a href="#posts" aria-current="page">Blog</a>
        </nav>

    <main id="content" class="blog-shell">
      <header class="blog-intro" id="top">
        <p class="eyebrow">Field notes</p>
        <h1>Blog</h1>
        <p>

      <section class="post-list" id="posts" aria-label="Blog posts">
        <div class="post-list-heading" aria-hidden="true">
          <span>Date</span>
          <span>Article</span>
        </div>

      </section>

    <footer class="site-footer">
      <div>
        <p>Anders Jensen</p>
        <a href="index.html">Portfolio</a>
      </div>
      <p>&copy; <span data-current-year>2026</span></p>
    </footer>

    <script>
      document.querySelectorAll('[data-current-year]').forEach((element) => {
        element.textContent = new Date().getFullYear();
      });
    </script>
